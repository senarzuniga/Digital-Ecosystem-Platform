# Nginx config: redirige senarzuniga -> ING_SITE y mantiene compatibilidad QR

worker_processes 1;

events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name _;

        # Redirección 301 de senarzuniga a ING_SITE
        location ~* ^/(.*)senarzuniga(.*)$ {
            return 301 $scheme://$host/$1ING_SITE$2$is_args$args;
        }

        # Proxy a la app backend (ajusta el puerto si es necesario)
        location / {
            proxy_pass http://backend:8000;  # Cambia el puerto si tu backend usa otro
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
